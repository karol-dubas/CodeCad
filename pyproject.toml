[project]
name = "codecad"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.13.0",
    "ocp-vscode>=4.3.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ipykernel>=7.4.0",
    "pyvista>=0.49.2",
    "pyvista-cad>=0.1.2",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", ".preview", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "ANN",
    "TID251",
    "RUF",
]
ignore = [
    "E501",    # Line length handled by formatter
    "ANN401",  # Allow Any where external C++/VTK/JSON payloads require it
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"build123d.export_stl".msg = "Do not export .stl files. Export .step only via export_step."
"build123d.mesher.Mesher".msg = "Do not export meshes directly in CAD scripts. Use export_step."

[tool.ruff.lint.per-file-ignores]
"preview_pipeline/loader.py" = ["TID251"]
"preview_pipeline/slicer.py" = ["TID251"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
failOnWarnings = true
exclude = [".venv", ".preview", "**/__pycache__"]
reportMissingTypeStubs = false
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUntypedFunctionDecorator = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
